[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-trail"
version = "0.2.0"
description = "Local token observability across AI clients, grouped by human intent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Token Trail contributors"}]
keywords = ["claude", "codex", "tokens", "observability", "agents"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
token-trail = "token_trail.cli:main"

[tool.setuptools.packages.find]
include = ["token_trail*"]

[tool.setuptools.package-data]
token_trail = ["web/*.html", "web/*.css", "web/*.js", "skill/*.md", "skill/references/*.md"]
